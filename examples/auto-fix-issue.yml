# ======================================================================================
# Workflow: Auto Fix Issue
# ======================================================================================
# Usage:
#   - Apply the label 'oz-agent' to any GitHub Issue.
#   - This workflow will trigger, analyze the issue, and attempt to write code to fix it.
#
# Setup:
#   - Ensure WARP_API_KEY is set in Repository Secrets.
#   - Ensure the Action has write permissions for contents, issues, and pull-requests.
#
# Expected Output:
#   - If a fix is found: A new Pull Request (fix/issue-NUMBER) is created and linked to the issue.
#   - If no fix is found: The Agent comments on the issue explaining why.
#
# When to use:
#   - Use this to delegate bug fixes, small features, or chore tasks to the Oz Agent.
# ======================================================================================
name: Auto Fix Issue

on:
  issues:
    types: [labeled]

jobs:
  auto_fix:
    # Only run if the label added is 'oz-agent'
    if: github.event.label.name == 'oz-agent'
    name: Auto Fix Issue
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure Default Git Identity
        run: |
          # Guarantees a git identity is present in this checkout even if the
          # Oz Agent decides to `git commit` (and even open its own PR) itself,
          # per instruction 4 below, instead of leaving the diff uncommitted for
          # the "Create PR and Comment" step to package afterwards. Without this,
          # an agent-initiated commit fails with "Author identity unknown" on the
          # ephemeral runner, which can also leave a half-created branch behind
          # that then collides with the fallback branch creation further down.
          git config --global user.name "Oz Agent"
          git config --global user.email "agent@warp.dev"

      - name: Construct Prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;

            // Fetch all previous comments on the issue to give the agent full context
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });

            const description = issue.body || 'No description provided.';

            let commentsNote = 'There are no previous comments on this issue.';
            let commentsInstructions = '';
            if (comments.length) {
              const commentsText = comments
                .map(c => `- ${c.user?.login || 'unknown'} (${c.created_at}): ${c.body}`)
                .join('\\n');
              fs.writeFileSync('issue_comments.txt', commentsText, 'utf8');
              commentsNote = 'All previous issue comments are stored in \`issue_comments.txt\` in the workspace.';
              commentsInstructions = `
                -   Optionally, read \`issue_comments.txt\` to understand prior discussion and clarifications.`;
            }

            const prompt = `You are an expert software engineer and the Oz Agent.
            You have been assigned to fix GitHub Issue #${issue.number}.

            **Issue Details**:
            - **Title**: ${issue.title}
            - **Description**: ${description}

            **Previous Issue Comments**:
            ${commentsNote}

            **Instructions**:
            1.  **Analyze**:
                -   Carefully read the issue description above to understand the problem.${commentsInstructions}
            2.  **Fix**: Implement the changes necessary to resolve the issue.
            3.  **Verify**: Ensure the code is correct and follows existing patterns.
            4.  **If you commit, push, and open the Pull Request yourself** (instead of leaving the changes uncommitted for this workflow to package into a PR afterwards), its body **MUST** include a GitHub closing keyword referencing this issue, e.g. \`Closes #${issue.number}\` (or \`Fixes #${issue.number}\`/\`Resolves #${issue.number}\`). Do not rely on the issue number merely appearing in the branch name, PR title, or as plain text like "Issue #${issue.number}" elsewhere in the body - none of those auto-close the issue on merge.
            5.  **Output**: Do not output the diff. Provide a brief summary of what you changed.
            `;
            core.setOutput('prompt', prompt);

      - name: Run Oz Agent
        uses: warpdotdev/oz-agent-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        id: agent
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          profile: ${{ vars.WARP_AGENT_PROFILE || '' }}

      - name: Save Agent Output
        run: |
          # Write the (potentially large, up to 1MB) agent transcript straight into
          # a file via heredoc, instead of an `env:` var. `env:` values are passed
          # through execve()'s environment block, which has a per-repo/OS size
          # limit (Linux MAX_ARG_STRLEN, ~128KB); once exceeded, the *next* step's
          # process fails to even start with "Argument list too long" before
          # anything is committed/pushed/commented. Heredoc content instead
          # becomes part of the script file read by bash, which has no such limit.
          cat <<'WARP_AGENT_OUTPUT_EOF' > /tmp/agent_output.txt
          ${{ steps.agent.outputs.agent_output }}
          WARP_AGENT_OUTPUT_EOF

      - name: Create PR and Comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Remove temporary files that should not be committed
          rm -f issue_comments.txt issue_description.txt

          # GitHub's GraphQL API caps comment and PR bodies at 65536 characters
          # (addComment/createPullRequest). agent_output.txt can be up to ~1MB
          # (the full, untruncated agent transcript), which would otherwise make
          # `gh issue comment --body-file` fail with "GraphQL: Body is too long
          # (maximum is 65536 characters)" whenever no code change was made. Cap
          # it well below the limit, leaving room for the surrounding text.
          MAX_AGENT_OUTPUT_CHARS=50000
          AGENT_OUTPUT_SIZE=$(wc -c < /tmp/agent_output.txt)
          if [ "$AGENT_OUTPUT_SIZE" -gt "$MAX_AGENT_OUTPUT_CHARS" ]; then
            head -c "$MAX_AGENT_OUTPUT_CHARS" /tmp/agent_output.txt > /tmp/agent_output_truncated.txt
            printf '\n\n... (truncated, full output was %s characters - see the workflow run logs for the complete transcript)\n' "$AGENT_OUTPUT_SIZE" >> /tmp/agent_output_truncated.txt
          else
            cp /tmp/agent_output.txt /tmp/agent_output_truncated.txt
          fi

          # Check for changes
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes made by Oz Agent."
            {
              echo "I analyzed the issue but couldn't determine a code change to make."
              echo
              echo "**Agent Output:**"
              cat /tmp/agent_output_truncated.txt
            } > /tmp/comment_body.txt
            # --body-file reads from disk (no argv/env size limit), unlike --body "$STRING".
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment_body.txt
            exit 0
          fi

          BRANCH_NAME="fix/issue-$ISSUE_NUMBER"

          # Identity is already configured globally by the "Configure Default
          # Git Identity" step above; no need to set it again here.

          # The Oz Agent may have already run `git checkout -b "$BRANCH_NAME"`
          # itself (per prompt instruction 4) before leaving the diff uncommitted
          # (e.g. if its own commit/PR attempt failed partway through) - reuse
          # that branch instead of erroring out on "branch already exists".
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            git checkout "$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi
          git add .
          git commit -m "Fix for Issue #$ISSUE_NUMBER"
          git push origin "$BRANCH_NAME" --force

          # Create PR
          # Escape title to handle special chars
          TITLE="Fix Issue #$ISSUE_NUMBER: ${{ github.event.issue.title }}"
          {
            echo "This PR attempts to fix Issue #$ISSUE_NUMBER."
            echo
            echo "**Agent Summary**:"
            cat /tmp/agent_output_truncated.txt
            echo
            echo "Closes #$ISSUE_NUMBER"
          } > /tmp/pr_body.txt

          # Create PR and capture URL (--body-file avoids passing the agent
          # output as a single, potentially oversized, argv string)
          PR_URL=$(gh pr create --title "$TITLE" --body-file /tmp/pr_body.txt --base main --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"

          # Comment on Issue
          gh issue comment "$ISSUE_NUMBER" --body "I have created a fix for this issue: $PR_URL"
